version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_news_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ai_news_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: ai_news_qdrant
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "6333:6333" # REST API
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------
  # Production services — активируются через: --profile prod
  #
  #   Dev (только инфра):  docker compose up -d
  #   Prod (всё):          docker compose --profile prod up -d --build
  # ---------------------------------------------------------------

  app:
    profiles: ["prod"]
    build: .
    container_name: ai_news_app
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  celery-worker:
    profiles: ["prod"]
    build: .
    container_name: ai_news_celery_worker
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo
    env_file: .env
    volumes:
      - ./ai_news_parser.session:/app/ai_news_parser.session
      - model_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    profiles: ["prod"]
    build: .
    container_name: ai_news_celery_beat
    command: celery -A app.tasks.celery_app beat --loglevel=info
    env_file: .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    profiles: ["prod"]
    build:
      context: ./frontend_mvp
    container_name: ai_news_frontend
    ports:
      - "3000:80"
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
  model_cache:
