version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_news_postgres
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_pass_2024!
      POSTGRES_DB: ai_news_manager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news_user -d ai_news_manager"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: ai_news_redis
    command: redis-server --requirepass redis_secret_789
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "redis_secret_789", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data: